<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuditLog</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <meta name="theme-color" content="#0f172a">

  <style>
    /* garante visibilidade mesmo sem CSS externo */
    .login-wrap { max-width: 420px; margin: 80px auto; text-align: center; }
    .login-card { padding: 20px; border-radius: 12px; background: #fff; color: #111827; box-shadow: 0 2px 10px #0001; }
    .hidden { display: none; }
  </style>
</head>

<body>

<!-- SPLASH / LOADING -->
<div id="splashScreen" class="splash" aria-live="polite">
  <div class="splash-content">
    <img
      src="assets/icons/logo_blue.png"
      class="splash-image"
      alt="Carregando"
      onerror="this.onerror=null;this.src='assets/icons/logo_blue.png';"
    >

    <p id="splashText" class="splash-text">
      Inicializando sistema...
    </p>

    <span class="splash-dev">
      Desenvolvido por Arthur Maicá
    </span>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="login-wrap hidden">
  <div class="login-card">
    <img src="assets/icons/logo_white.png" alt="Logo" class="login-logo">
    <h2>Login necessário</h2>
    <p>Entre com sua conta Google</p>

    <div id="googleBtn"></div>
    <p id="loginMsg" class="hidden"></p>
  </div>
</div>

<!-- 🚀 APP -->
<main id="appRoot" class="hidden"></main>

<!-- GOOGLE API -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/splash.js"></script>

<!-- APP JS (carregado depois do load completo) -->
<script>
window.addEventListener("load", () => {

  console.log("🚀 WINDOW LOAD OK");

  const script = document.createElement("script");
  script.type = "module";
  script.src = "assets/js/app.js";

  script.onload = () => {
    console.log("📦 app.js carregado");
  };

  script.onerror = (e) => {
    console.error("❌ erro ao carregar app.js", e);
  };

  document.body.appendChild(script);
});
</script>

</body>
</html>
