name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - name: Validate configuration
        run: |
          test -n "$SUPABASE_URL"

      - name: Debug Supabase URL
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL"
          echo "FINAL_URL=$SUPABASE_URL/storage/v1/version"

      - name: Ping Supabase
        run: |
          curl -v \
            "$SUPABASE_URL/storage/v1/version"